name: BlogAPI-CI/CD

on:
    push:
        branches:
            - master
    pull_request:
        branches:
            - master

jobs:
    test:
        runs-on: ubuntu-latest

        env:
            NODE_ENV: test
            PORT: 5000
            DATABASE: mongodb://localhost:27017/blog_api_test

        services:
            mongodb:
                image: mongo:8
                ports:
                    - 27017:27017
                options: >-
                    --health-cmd "mongosh --quiet --eval 'db.runCommand({ping: 1}).ok'"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Run tests
              run: npm test

    build-and-push:
        needs: test
        if: github.event_name == 'push'
        runs-on: ubuntu-latest

        permissions:
            contents: read

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Log in to DockerHub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Create dynamic dockter tags
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ secrets.DOCKERHUB_USERNAME }}/blog_api
                  tags: |
                      type=raw,value=latest
                      type=sha,format=long,prefix=sha-
                      type=ref,event=branch

            - name: Build and push Docker image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}

    deploy:
        name: Deploy to EC2
        needs: build-and-push
        if: github.event_name == 'push'
        runs-on: ubuntu-latest

        concurrency:
            group: blog-api-production
            cancel-in-progress: false

        permissions:
            id-token: write
            contents: read

        steps:
            - name: Configure temporary AWS credentials
              uses: aws-actions/configure-aws-credentials@v6.2.4
              with:
                  role-to-assume: ${{ vars.AWS_ROLE_ARN }}
                  role-session-name: BlogApiDeployment
                  aws-region: ${{ vars.AWS_REGION }}

            - name: Deploy image through System Manager
              id: deploy
              env:
                  INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
                  IMAGE_TAG: sha-${{ github.sha }}
                  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
                  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
              run: |
                  COMMAND_ID=$(aws ssm send-command \
                    --instance-ids "$INSTANCE_ID" \
                    --document-name "AWS-RunShellScript" \
                    --comment "Deploy Blog API commit $GITHUB_SHA" \
                    --parameters "commands=[
                      \"set -e\",
                      \"export HOME=/root\",
                      \"export DOCKERHUB_USERNAME=$DOCKERHUB_USERNAME\",
                      \"export IMAGE_TAG=$IMAGE_TAG\",
                      \"export DOCKERHUB_TOKEN=$DOCKERHUB_TOKEN\",
                      \"cd /opt/blog-api\",
                      \"git config --global --add safe.directory /opt/blog-api\",
                      \"git pull --ff-only origin master\",
                      \"echo $DOCKERHUB_TOKEN | docker login -u $DOCKERHUB_USERNAME --password-stdin\",
                      \"IMAGE_TAG=$IMAGE_TAG DOCKERHUB_USERNAME=$DOCKERHUB_USERNAME docker compose pull app\",
                      \"IMAGE_TAG=$IMAGE_TAG DOCKERHUB_USERNAME=$DOCKERHUB_USERNAME docker compose up -d --remove-orphans\",
                      \"docker compose ps\",
                      \"curl --fail --retry 10 --retry-delay 3 http://localhost:5000\"
                      ]"\
                      --query "Command.CommandId" \
                      --output text)
                      
                  echo "SSM command ID: $COMMAND_ID"

                  if ! aws ssm wait command-executed \
                      --command-id "$COMMAND_ID" \
                      --instance-id "$INSTANCE_ID"; then
                      echo "Deployment failed. Retrieving command result..."
                      aws ssm get-command-invocation \
                          --command-id "$COMMAND_ID" \
                          --instance-id "$INSTANCE_ID" 
                      exit 1
                  fi

                  aws ssm get-command-invocation \
                      --command-id "$COMMAND_ID" \
                      --instance-id "$INSTANCE_ID" \
                      --query "StandardOutputContent" \
                      --output text
